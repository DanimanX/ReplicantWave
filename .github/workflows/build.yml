name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: replicantwave-linux
            platform: Linux
          - os: macos-latest
            artifact-name: replicantwave-macos
            platform: macOS
          - os: windows-latest
            artifact-name: replicantwave-windows
            platform: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libjack-jackd2-dev zip

      - name: Build Plugins & Bundles (VST3 & CLAP)
        run: cargo xtask bundle replicantwave --release

      - name: Build Standalone Executable
        run: cargo build --release --bin replicantwave-standalone

      - name: Package macOS AudioUnit (AU)
        if: matrix.os == 'macos-latest'
        run: |
          bash tools/build_au.sh || true

      - name: Package Multi-Format Release Artifacts (VST3, CLAP, AU, Standalone)
        shell: bash
        run: |
          mkdir -p dist_release
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows VST3
            cd target/bundled && 7z a ../../dist_release/ReplicantWave-${VERSION}-Windows-VST3.zip replicantwave.vst3 && cd ../..
            # Windows CLAP
            cd target/bundled && 7z a ../../dist_release/ReplicantWave-${VERSION}-Windows-CLAP.zip replicantwave.clap && cd ../..
            # Windows Standalone
            cd target/release && 7z a ../../dist_release/ReplicantWave-${VERSION}-Windows-Standalone.zip replicantwave-standalone.exe && cd ../..
            # Windows All
            cd target/bundled && 7z a ../../dist_release/ReplicantWave-${VERSION}-Windows-All.zip * && cd ../..
            cd target/release && 7z a ../../dist_release/ReplicantWave-${VERSION}-Windows-All.zip replicantwave-standalone.exe && cd ../..

          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS VST3
            cd target/bundled && zip -r -y ../../dist_release/ReplicantWave-${VERSION}-macOS-VST3.zip replicantwave.vst3 && cd ../..
            # macOS CLAP
            cd target/bundled && zip -r -y ../../dist_release/ReplicantWave-${VERSION}-macOS-CLAP.zip replicantwave.clap && cd ../..
            # macOS AudioUnit (AU)
            if [ -d target/bundled/ReplicantWave.component ]; then
              cd target/bundled && zip -r -y ../../dist_release/ReplicantWave-${VERSION}-macOS-AU.zip ReplicantWave.component && cd ../..
            fi
            # macOS Standalone
            cd target/release && zip -r -y ../../dist_release/ReplicantWave-${VERSION}-macOS-Standalone.zip replicantwave-standalone && cd ../..
            # macOS All
            cd target/bundled && zip -r -y ../../dist_release/ReplicantWave-${VERSION}-macOS-All.zip * && cd ../..
            cd target/release && zip -u ../../dist_release/ReplicantWave-${VERSION}-macOS-All.zip replicantwave-standalone && cd ../..

          else
            # Linux VST3
            cd target/bundled && zip -r ../../dist_release/ReplicantWave-${VERSION}-Linux-VST3.zip replicantwave.vst3 && cd ../..
            # Linux CLAP
            cd target/bundled && zip -r ../../dist_release/ReplicantWave-${VERSION}-Linux-CLAP.zip replicantwave.clap && cd ../..
            # Linux Standalone
            cd target/release && tar -czvf ../../dist_release/ReplicantWave-${VERSION}-Linux-Standalone.tar.gz replicantwave-standalone && cd ../..
            # Linux All
            cd target/bundled && zip -r ../../dist_release/ReplicantWave-${VERSION}-Linux-All.zip replicantwave.* && cd ../..
            cd target/release && zip -u ../../dist_release/ReplicantWave-${VERSION}-Linux-All.zip replicantwave-standalone && cd ../..
          fi

          ls -lh dist_release/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist_release/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded release assets
        run: |
          echo "=== Release Assets to Upload ==="
          ls -la artifacts/*/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
          generate_release_notes: true
