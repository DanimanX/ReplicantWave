name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: replicatwave-linux
            bundle-path: target/bundled/
          - os: macos-latest
            artifact-name: replicatwave-macos
            bundle-path: target/bundled/
          - os: windows-latest
            artifact-name: replicatwave-windows
            bundle-path: target/bundled/

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build Plugins & Bundles
        run: cargo xtask bundle replicatwave --release

      - name: Build Standalone
        run: cargo build --release --bin replicatwave-standalone

      - name: Package macOS AudioUnit (AU)
        if: matrix.os == 'macos-latest'
        run: |
          bash tools/build_au.sh || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            target/bundled/
            target/release/replicatwave-standalone*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            replicatwave-linux/*
            replicatwave-macos/*
            replicatwave-windows/*
          generate_release_notes: true
